<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders | Baba Electronics & Electricals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-main">
    <a class="brand" href="index.html" style="text-decoration:none;">
      <div class="brand-mark">
        <img src="logo.png" alt="Baba Electronics & Electricals logo" />
      </div>
      <span class="brand-name">Baba Electronics &amp; Electricals</span>
    </a>
  </div>
</header>

<main class="wrap simple-page">
  <h1 class="page-title">My Orders</h1>
  <p class="page-sub">Enter the phone number you used when placing an order to see its status and details.</p>

  <div id="firebase-warning" class="state-message" hidden>
    Order history isn't set up yet — the shop is still connecting this page to its order database.
    Please check back soon, or contact the shop directly.
  </div>

  <form class="lookup-form" id="lookup-form">
    <input type="tel" id="lookup-phone" placeholder="e.g. 99XXX XXXXX" required />
    <button type="submit" class="btn-primary">Find my orders</button>
  </form>

  <div id="results"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="config.js"></script>
<script src="order-calc.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="logo-data.js"></script>
<script src="pdf-builder.js"></script>
<script>
function statusLabel(s) {
  return orderStatusLabel(s || "pending");
}

function formatPrice(price) {
  if (price === null || price === undefined) return "Contact for price";
  const hasCents = Math.round(price * 100) % 100 !== 0;
  return "₹" + price.toLocaleString("en-IN", { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
}

// Regenerates and downloads the Payment Receipt PDF from an order's latest
// saved data — identical logic to the admin panel's regenerate button, so
// the customer always gets the current, admin-modified figures.
function downloadReceiptFor(order) {
  const items = (order.items || []).map((it) => ({
    name: it.name,
    qty: it.qty,
    price: it.price,
    lineTotal: it.lineTotal !== undefined && it.lineTotal !== null ? it.lineTotal : (it.price === null || it.price === undefined ? null : it.price * it.qty),
  }));
  const date = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate() : new Date();
  const result = renderPaymentReceiptPDF({
    orderNo: order.orderNo,
    shopName: getShopNameOf(order),
    customerName: order.customerName,
    customerPhone: order.customerPhone,
    customerAddress: getCustomerAddressOf(order),
    items,
    previousBalance: getPreviousBalanceOf(order),
    currentOrderTotal: getCurrentOrderTotalOf(order),
    total: getOrderTotalOf(order),
    paymentReceived: getPaymentReceivedOf(order),
    balanceRemaining: getBalanceRemainingOf(order),
    paymentStatus: getPaymentStatusOf(order),
    date,
  });
  if (result) result.doc.save(result.filename);
}

function renderOrders(orders) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  if (orders.length === 0) {
    results.innerHTML = `<p class="state-message">No orders found for that phone number. Double-check the number, or place a new order from the <a href="index.html">shop</a>.</p>`;
    return;
  }

  orders.forEach((order, idx) => {
    const date = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate() : null;
    const dateStr = date ? date.toLocaleDateString("en-IN") + " · " + date.toLocaleTimeString("en-IN") : "";

    const itemsStr = (order.items || [])
      .map((it) => `${it.name} × ${it.qty}`)
      .join(", ");

    const balanceRemaining = getBalanceRemainingOf(order);
    const paymentStatus = getPaymentStatusOf(order);
    const paymentReceived = getPaymentReceivedOf(order);
    const hasBeenProcessed = paymentReceived > 0 || (order.auditLog && order.auditLog.length > 0);

    const notificationHtml =
      order.notification && order.notification.message
        ? `<div class="payment-notification">🔔 ${order.notification.message}</div>`
        : "";

    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div class="order-card-top">
        <div>
          <p class="order-ref">${order.orderNo}</p>
          <p class="order-date">${dateStr}${order.customerName ? " · " + order.customerName : ""}</p>
        </div>
        <span class="status-badge status-${order.status || "pending"}">${statusLabel(order.status || "pending")}</span>
      </div>
      ${notificationHtml}
      <p class="order-items">${itemsStr}</p>
      <p class="order-total">${formatPrice(getOrderTotalOf(order))}${order.hasUnpriced ? " + items needing a quote" : ""}</p>
      <p class="order-total" style="font-size:13px;color:#566b6a;">Payment: ${paymentStatusLabel(paymentStatus)} · Balance ${balanceRemaining < 0 ? "in advance" : "due"}: ${formatPrice(Math.abs(balanceRemaining))}</p>
      ${hasBeenProcessed ? `<button class="text-link" data-action="receipt" data-idx="${idx}">Download Payment Receipt</button>` : ""}
    `;
    results.appendChild(card);
  });

  results.querySelectorAll('[data-action="receipt"]').forEach((btn) => {
    btn.addEventListener("click", () => downloadReceiptFor(orders[Number(btn.dataset.idx)]));
  });
}

document.addEventListener("DOMContentLoaded", () => {
  if (!isFirebaseReady()) {
    document.getElementById("firebase-warning").hidden = false;
    document.getElementById("lookup-form").style.display = "none";
    return;
  }

  document.getElementById("lookup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const phone = document.getElementById("lookup-phone").value.trim();
    if (!phone) return;

    const results = document.getElementById("results");
    results.innerHTML = `<p class="state-message">Searching…</p>`;

    try {
      const snapshot = await db
        .collection("orders")
        .where("customerPhone", "==", phone)
        .orderBy("createdAt", "desc")
        .get();
      const orders = snapshot.docs.map((doc) => doc.data());
      renderOrders(orders);
    } catch (err) {
      console.error(err);
      results.innerHTML = `<p class="state-message">Something went wrong while searching. Please try again in a moment.</p>`;
    }
  });
});
</script>
</body>
</html>
